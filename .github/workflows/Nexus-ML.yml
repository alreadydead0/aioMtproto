name: Auto Extract Zip to Repo

on:
  push:
    paths:
      - '*.zip' 

jobs:
  extract_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Git Configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Extract Zip File Safely
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "No zip file found."
          exit 0
        fi

        # Check for path traversal attempts in zip contents
        if unzip -l "$ZIP_FILE" | grep -E '\.\./'; then
          echo "Security Error: Zip file contains path traversal references ('../'). Aborting."
          exit 1
        fi
        
        echo "Extracting $ZIP_FILE..."
        
        mkdir -p temp_extract
        unzip -q "$ZIP_FILE" -d temp_extract/
        
        rm "$ZIP_FILE"
        
        # Hardening: Purge any attempt to modify or overwrite .github/ workflows or config
        find temp_extract -name ".github" -exec rm -rf {} + 2>/dev/null || true

        if [ $(ls temp_extract | wc -l) -eq 1 ] && [ -d temp_extract/* ]; then
          cp -rn temp_extract/*/* ./ 2>/dev/null || true
          rm -rf temp_extract
        else
          cp -rn temp_extract/* ./ 2>/dev/null || true
          rm -rf temp_extract
        fi

    - name: Commit and Push Extracted Files
      run: |
        # Prevent adding any modified .github files
        git checkout -- .github
        git add .
        
        if git diff --staged --quiet; then
          echo "No new files to commit."
        else
          git commit -m "NEXUS-ML [hardened extraction]"
          git push origin HEAD:${{ github.ref }}
        fi
